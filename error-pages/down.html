<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="20">
<title>bldbible.com — Be right back</title>
<style>
  :root {
    --bg:     #0e0e0f;
    --bg2:    #16161a;
    --border: #2c2c35;
    --text:   #e8e6e0;
    --text3:  #72706a;
    --text4:  #484640;
    --gold:   #e8aa55;
    --blue:   #4a9eff;
    --blue2:  #2a7edf;
    --paleo-font: 'Segoe UI Historic','Segoe UI',sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    min-height: 100vh;
    padding: 60px 24px;
    text-align: center;
  }
  .mark {
    width: 96px;
    height: 96px;
    border-radius: 16px;
    border: 1px solid var(--border);
    background: var(--bg2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--paleo-font);
    font-size: 34px;
    color: var(--gold);
    letter-spacing: -2px;
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.55; }
  }
  h1 {
    font-size: 21px;
    font-weight: 600;
    margin: 0;
    color: var(--text);
  }
  p {
    font-size: 14px;
    color: var(--text3);
    max-width: 380px;
    line-height: 1.6;
    margin: 0;
  }
  .retry-btn {
    background: var(--blue2);
    color: #fff;
    border: none;
    padding: 12px 30px;
    border-radius: 7px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    min-height: 46px;
  }
  .retry-btn:hover  { background: var(--blue); }
  .retry-btn:active { transform: scale(0.98); }
  .countdown {
    font-size: 12px;
    color: var(--text4);
    letter-spacing: 0.03em;
  }
</style>
</head>
<body>
  <div class="mark">𐤀𐤁</div>
  <h1>We'll be right back</h1>
  <p>bldbible.com is temporarily down. This is usually a short hiccup — please try again in a few moments.</p>
  <button class="retry-btn" onclick="location.reload()">Try again</button>
  <div class="countdown" id="countdown">Retrying automatically in 20s…</div>

  <script>
    var n = 20;
    var el = document.getElementById('countdown');
    setInterval(function () {
      n -= 1;
      if (n <= 0) { location.reload(); return; }
      el.textContent = 'Retrying automatically in ' + n + 's…';
    }, 1000);
  </script>
</body>
</html>
