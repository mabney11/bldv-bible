name: Build and push image

# Builds the same two-stage Dockerfile used in deploy-blue-green.sh, but on
# GitHub's runner instead of the 2 vCPU / 1.9GB Lightsail box that serves
# live traffic. 2026-09-16: building in-place on that box (npm ci --omit=dev
# recompiling better-sqlite3, then even a plain COPY step) twice starved the
# still-running container of memory and then disk I/O during the same
# evening, taking bldbible.com down both times even though the container
# itself never crashed. deploy-blue-green.sh now does `docker pull` from
# GHCR instead of `docker build` — a pull is just a sequential layer
# download, nothing on the box compiles or diffs a filesystem, so the box
# has nothing left to be starved by.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  IMAGE_NAME: ghcr.io/mabney11/paleo-studio

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
