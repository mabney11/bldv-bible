<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0e0f" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Paleo-Hebrew Translation Studio</title>

    <!-- Baseline SEO tags. This is a client-rendered SPA with no server-side
         rendering, so these are the ONLY title/description/OG tags most
         crawlers and every link-preview bot ever see — per-page titles set
         via document.title in React (see src/hooks/usePageTitle.js) only
         reach renderers that execute JS. Keep this description accurate for
         the app as a whole, since it's what represents every route until a
         real per-route SSR/prerender solution exists. -->
    <meta name="description" content="Paleo-Hebrew Translation Studio (BLD Bible) — read Hebrew, Greek, Latin, Ge'ez and Syriac scripture word by word with Strong's numbers, a concordance, root and lexicon tools, and a Hebrew-backed English Bible translation." />
    <!-- No static canonical here on purpose: this one shell serves every
         route (/landing, /works, /translate, /parallel, /concordance, …).
         A single hardcoded canonical would tell Google every one of those
         pages is really "/landing" and should be dropped from the index in
         its favor — the opposite of what we want. App.jsx sets a real,
         self-referencing canonical per route on every navigation instead
         (see the SelfCanonical component). -->
    <link rel="canonical" href="https://www.bldbible.com/" id="canonical-link" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Paleo-Hebrew Translation Studio" />
    <meta property="og:title" content="Paleo-Hebrew Translation Studio — BLD Bible" />
    <meta property="og:description" content="Read Hebrew, Greek, Latin, Ge'ez and Syriac scripture word by word with Strong's numbers, a concordance, root and lexicon tools, and a Hebrew-backed English Bible translation." />
    <meta property="og:url" content="https://www.bldbible.com/landing" />
    <meta property="og:image" content="https://www.bldbible.com/favicon.svg" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Paleo-Hebrew Translation Studio — BLD Bible" />
    <meta name="twitter:description" content="Read Hebrew, Greek, Latin, Ge'ez and Syriac scripture word by word with Strong's numbers, a concordance, root and lexicon tools, and a Hebrew-backed English Bible translation." />

    <!-- Names the site explicitly as "BLD Bible" / "bldbible" so search
         engines have a real, structured signal for what that string refers
         to — the query was surfacing an unrelated Lun Bawang Bible
         translation (also informally "BLD") ahead of this site. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Paleo-Hebrew Translation Studio",
      "alternateName": ["BLD Bible", "bldbible"],
      "url": "https://www.bldbible.com/",
      "description": "Read Hebrew, Greek, Latin, Ge'ez and Syriac scripture word by word with Strong's numbers, a concordance, root and lexicon tools, and a Hebrew-backed English Bible translation.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://www.bldbible.com/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
